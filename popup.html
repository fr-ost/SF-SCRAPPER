<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SF Scrapper</title>
  <link rel="stylesheet" href="ui/common.css">
  <style>
    body { width: 420px; padding: 12px; }
    .jobs td, .jobs th { padding: 4px 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
    <h1>⚡ SF Scrapper</h1>
    <button id="openDash">Open dashboard ↗</button>
  </div>
  <div id="noKey" class="notice" hidden>No API key yet. <a href="#" id="toSettings">Add it in Settings</a>.</div>

  <div class="panel">
    <label>X usernames (one per line, @handles or x.com links)</label>
    <textarea id="users" rows="4" placeholder="@VitalikButerin&#10;https://x.com/cz_binance"></textarea>
    <div class="row" style="margin-top:8px">
      <div><label>Min score (only save ≥)</label><input id="minScore" type="number" min="0" step="1" value="0" style="width:120px"></div>
      <div class="grow"></div>
      <button id="start" class="primary">Start scraping</button>
    </div>
    <div id="msg" class="small muted" style="margin-top:6px"></div>
  </div>

  <div class="panel">
    <div id="status" style="margin-bottom:8px"></div>
    <div class="cards">
      <div class="card" id="usage" style="grid-column: span 2"></div>
      <div class="card"><div class="k">Saved (session)</div><div class="v" id="saved">0</div></div>
      <div class="card"><div class="k">New accounts</div><div class="v" id="newAcc">0</div></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="stop" class="danger">Stop</button>
      <button id="resume">Resume</button>
    </div>
  </div>

  <div class="panel" style="padding:8px">
    <table class="jobs"><thead><tr><th>Account</th><th>Status</th><th class="num">Saved</th><th class="num">Req</th></tr></thead><tbody id="jobs"></tbody></table>
  </div>
  <script type="module" src="ui/popup.js"></script>
</body>
</html>
